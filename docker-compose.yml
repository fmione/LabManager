services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: labmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mqtt:
    image: eclipse-mosquitto:2
    container_name: labmanager-mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqttdata:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"

  app:
    build: .
    container_name: labmanager-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-#}
      SECRET_KEY: ${SECRET_KEY}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-86400}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lab.local}
    ports:
      - "8082:8000"

volumes:
  pgdata:
  mqttdata:
