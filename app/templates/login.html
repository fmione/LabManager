<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso - LabManager</title>
  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="login-bg">
<div class="w-100 d-flex justify-content-center">
  <div class="login-card card shadow">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-droplet-half fs-1 text-primary"></i>
        <h4 class="mb-1 mt-2">LabManager</h4>
        <p class="text-muted small mb-0">Monitoreo de sensores IoT de laboratorio</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input class="form-control" name="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".alert").forEach(function (el) {
    setTimeout(function () { el.classList.add("d-none"); }, 10000);
  });
});
</script>
</body>
</html>
